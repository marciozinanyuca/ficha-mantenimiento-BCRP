name: Build and deploy Python app to Azure Web App - backend-fichas-api

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Solo se disparará si haces cambios en el backend
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'backend-fichas-api'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_BACKEND }}
          package: ./backend # Mantenemos el truco del monorepo
