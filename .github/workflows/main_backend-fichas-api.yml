name: Build and Push Backend to ACR

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_backend-fichas-api.yml'
  workflow_dispatch:

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        working-directory: ./backend
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/backend-fichas-api:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/backend-fichas-api:latest
