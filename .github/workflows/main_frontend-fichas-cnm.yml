name: Dual Deploy Frontend (App Service & Container Apps)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # RUTA 1: MANTENER APP SERVICE ACTUAL (TU CÓDIGO ORIGINAL)
  # ==========================================
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: npm install, build, and prep for Azure
        working-directory: ./frontend
        env:
          BUILD_DIR: build
          # Actualizamos el App Service para que hable con el nuevo Backend en ACA
          NEXT_PUBLIC_API_URL: "https://backend-fichas-api.azurewebsites.net"
        run: |
          npm install
          npm run build --if-present
          cp -r build/static build/standalone/build/
          cp -r public build/standalone/ || true
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./frontend/build/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_67F2910A0F574CB08E844D6F67D5ACD4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6FCDC3591232429CB6008328FF1027ED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A1B5E549995D4A17BF9A67258BAC80D9 }}
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'frontend-fichas-cnm'
          slot-name: 'Production'
          package: .

  # ==========================================
  # RUTA 2: ENVIAR DOCKER A CONTAINER REGISTRY (NUEVO)
  # ==========================================
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        working-directory: ./frontend
        run: |
          # Construimos el contenedor inyectando la nueva URL del backend
          docker build --build-arg NEXT_PUBLIC_API_URL="https://backend-fichas-aca.jollyocean-8b7d7f25.eastus.azurecontainerapps.io" -t ${{ secrets.ACR_LOGIN_SERVER }}/frontend-fichas-app:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend-fichas-app:latest
